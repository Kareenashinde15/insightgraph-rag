services:
  - type: web
    name: insightgraph-rag-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: STORAGE_BACKEND
        value: mongodb
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: insightgraph
      - key: ENABLE_KNOWLEDGE_GRAPH
        # Graph enrichment remains optional and is processed asynchronously.
        value: "false"
      - key: OPENDATALOADER_HYBRID
        value: ""
      - key: OPENDATALOADER_HYBRID_URL
        sync: false
      - key: OPENDATALOADER_HYBRID_MODE
        value: ""
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "52428800"
      - key: CORS_ORIGINS
        sync: false
