services:
  - type: web
    name: insightgraph-rag-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: EMBEDDING_MODEL
        value: fallback
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: ENABLE_KNOWLEDGE_GRAPH
        value: "true"
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "52428800"
      - key: CORS_ORIGINS
        value: https://insightsrag.vercel.app
